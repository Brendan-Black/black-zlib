# black-rust: layout. Owned by cargo black; edit it in black-rust, not here.
hard_tabs = true
tab_spaces = 2
max_width = 160
# Short things stay on one line, up to the full width, like the Java profile's one-line blocks.
use_small_heuristics = "Max"
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
